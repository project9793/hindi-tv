name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Bundle web app into APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          find . -maxdepth 1 -mindepth 1 \
            ! -name android ! -name .git ! -name .github \
            ! -name '*.zip' ! -name '*.apk' \
            -exec cp -r {} android/app/src/main/assets/www/ \;
          echo "bundled:"; ls android/app/src/main/assets/www

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-tv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Hindi TV v1.0.0
          body: |
            Hindi TV - Android APK built from this repository (WebView shell).

            Direct download: https://github.com/project9793/hindi-tv/releases/latest/download/app-debug.apk
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
